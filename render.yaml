services:
  - type: web
    name: ikberspor
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node dist/boot.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ikberspor-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PROTOCOL
        value: https

databases:
  - name: ikberspor-db
    databaseName: ikberspor
    user: ikber
    plan: free
